<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Plantilla del sistema unified RMS</title>
  <defs>
    <!-- Ejemplo Ventas/CRM: sustituir ambos colores según el área. -->
    <linearGradient id="areaBackground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3670ED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#areaBackground)"/>
  <!-- Guía de área segura; activar solo durante el diseño:
  <rect x="112" y="112" width="288" height="288" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8"/>
  -->
  <!-- Añadir aquí el pictograma; mantener el trazo completo en el área segura. -->
  <!-- Estilo sugerido del pictograma: fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round". -->
</svg>
