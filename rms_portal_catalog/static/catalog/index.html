<title>Catálogo RMS Proaudio</title>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:opsz,wght@14..40,400;14..40,500;14..40,600;14..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#faf7f2;
    --surface:#ffffff;
    --surface-2:#f2ede4;
    --ink:#1d1d1f;
    --muted:#6e6e73;
    --line:#e2ddd2;
    --accent:#a9722e;
    --accent-ink:#5a3d18;
    --brand:#3b6fae;
    --radius:18px;
    --disp:'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --sans:'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    color-scheme: light dark;
  }
  /* El tema solo cambia si el visitante pulsa el botón — nunca por el sistema,
     para que la pantalla se vea igual en cualquier tablet delante de un cliente. */
  :root[data-theme="dark"]{
    --paper:#000000; --surface:#1d1d1f; --surface-2:#2a2a2c; --ink:#f5f5f7;
    --muted:#86868b; --line:#424245; --accent:#d79a4a; --accent-ink:#f3d6a3;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  ::selection{background:var(--accent);color:#fff;}

  .wrap{max-width:1180px;margin:0 auto;padding-inline:24px;}
  @media (max-width:600px){ .wrap{padding-inline:16px;} }

  header.site{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  }
  .site-bar{display:flex; align-items:center; gap:14px; padding-block:14px;}
  .mark{display:flex; align-items:center; cursor:pointer; flex:none;}
  .mark .blogo{height:26px; width:auto; display:block;}
  :root[data-theme="dark"] .blogo, :root[data-theme="dark"] .bhero-logo{filter:invert(1);}

  .searchbox{flex:1; position:relative; max-width:440px; margin-left:auto;}
  .searchbox input{
    width:100%; border:1px solid var(--line); background:var(--surface);
    border-radius:980px; padding:9px 16px 9px 38px; font-size:14px; color:var(--ink); font-family:var(--sans);
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .searchbox input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  .searchbox svg{position:absolute; left:13px; top:50%; translate:0 -50%; width:15px; height:15px; color:var(--muted); pointer-events:none;}
  .searchbox .kbd{
    position:absolute; right:8px; top:50%; translate:0 -50%; font-family:var(--mono); font-size:10px; color:var(--muted);
    border:1px solid var(--line); border-radius:5px; padding:2px 6px; pointer-events:none;
  }
  @media (max-width:640px){ .searchbox .kbd{display:none;} }

  .theme-btn{
    flex:none; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .theme-btn svg{width:16px; height:16px;}
  .theme-btn .i-sun{display:none;}
  :root[data-theme="dark"] .theme-btn .i-moon{display:none;}
  :root[data-theme="dark"] .theme-btn .i-sun{display:block;}

  .contact-link{
    flex:none; display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    border-radius:980px; padding:8px 14px 8px 12px; font-size:13px; font-weight:600; color:var(--ink);
    text-decoration:none; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .contact-link:hover{border-color:var(--accent); color:var(--accent-ink);}
  .contact-link svg{width:15px; height:15px; flex:none;}
  @media (max-width:640px){ .contact-link span{display:none;} .contact-link{padding:8px; border-radius:50%;} }

  .results{
    position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 20px 44px -16px rgba(0,0,0,.22); max-height:420px; overflow-y:auto; display:none; z-index:60;
  }
  .results.open{display:block;}
  .results .r-item{display:flex; align-items:center; gap:12px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line);}
  .results .r-item:last-child{border-bottom:none;}
  .results .r-item:hover{background:var(--surface-2);}
  .results img{width:34px; height:34px; object-fit:cover; border-radius:6px; flex:none; border:1px solid var(--line);}
  .r-text{min-width:0;}
  .r-title{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-sub{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-brand{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); margin-top:2px;}
  .r-empty{padding:22px 14px; color:var(--muted); font-size:13px; text-align:center;}

  .hero{padding-block:56px 8px;}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink);
    background:color-mix(in srgb, var(--accent) 14%, transparent); display:inline-flex; padding:5px 11px; border-radius:980px; margin-bottom:20px;
  }
  h1.hero-title{
    font-family:var(--disp); font-weight:700; font-size:clamp(34px,5.4vw,56px);
    line-height:1.04; margin:0 0 14px; text-wrap:balance; max-width:15ch; letter-spacing:-0.02em;
  }
  .hero p.lede{font-size:18px; line-height:1.42; color:var(--muted); max-width:52ch; margin:0 0 8px; font-weight:450;}

  .marquee{margin-top:36px; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
  .marquee-track{display:flex; gap:12px; width:max-content; animation:scroll 40s linear infinite;}
  .marquee:hover .marquee-track{animation-play-state:paused;}
  @keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .m-item{width:74px; flex:none; border-radius:10px; overflow:hidden; border:1px solid var(--line); cursor:pointer; aspect-ratio:1/1; background:var(--surface);}
  .m-item img{width:100%; height:100%; object-fit:cover; object-position:50% 22%; filter:grayscale(1) contrast(.95); opacity:.55; transition:filter .25s ease, opacity .25s ease, transform .25s ease;}
  .m-item:hover img{filter:none; opacity:1; transform:scale(1.05);}

  .section-title{font-family:var(--disp); font-weight:700; font-size:22px; margin:0 0 4px; letter-spacing:-0.01em;}
  .section-sub{color:var(--muted); font-size:14px; margin:0 0 18px;}

  .group-nav{display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 28px;}
  .gchip{
    border:1px solid var(--line); background:var(--surface); border-radius:980px; padding:8px 15px;
    font-size:13px; font-weight:500; cursor:pointer; color:var(--muted); transition:.15s ease;
  }
  .gchip:hover{color:var(--ink);}
  .gchip.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .brand-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:8px; padding-bottom:64px;}
  .brand-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:30px 26px 22px; cursor:pointer;
    position:relative; overflow:hidden; transition:transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
    display:flex; flex-direction:column; align-items:flex-start; min-height:190px;
  }
  .brand-card:hover{transform:translateY(-4px); box-shadow:0 22px 44px -20px rgba(0,0,0,.18);}
  .brand-card.hidden{display:none;}
  .brand-card .blogo{
    height:30px; width:auto; margin-bottom:18px; max-width:100%;
  }
  .brand-card .btag{color:var(--muted); font-size:13.5px; line-height:1.4; margin:0 0 20px; font-weight:450;}
  .brand-meta{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:14px; border-top:1px solid var(--line); width:100%;}
  .brand-count{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.02em;}
  .brand-cta{font-size:13px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:5px;}
  .brand-card:hover .brand-cta svg{transform:translateX(3px);}
  .brand-cta svg{width:13px; height:13px; transition:transform .18s ease;}

  .bhero{padding-block:44px 6px; border-bottom:1px solid var(--line);}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:22px; cursor:pointer; font-weight:500;}
  .back-link svg{width:13px;height:13px;}
  .back-link:hover{color:var(--ink);}
  .bhero-logo{height:36px; width:auto; margin-bottom:18px; display:block;}
  .bhero-sub{color:var(--muted); font-size:16px; max-width:52ch; line-height:1.4; margin:0 0 26px; font-weight:450;}
  .bhero-stats{display:flex; gap:28px; margin-bottom:24px; flex-wrap:wrap;}
  .stat b{font-family:var(--disp); font-size:22px; display:block; font-weight:700;}
  .stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}

  .empty-state{padding-block:40px 80px; color:var(--muted); font-size:15px; max-width:44ch;}

  .series-nav{position:sticky; top:calc(56px + env(safe-area-inset-top,0px)); z-index:30; background:var(--paper); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;}
  .series-nav::-webkit-scrollbar{display:none;}
  .series-nav-track{display:flex; gap:8px; padding-block:12px; white-space:nowrap;}
  .chip{border:1px solid var(--line); background:var(--surface); border-radius:980px; padding:7px 14px; font-size:12.5px; font-weight:500; cursor:pointer; flex:none; color:var(--muted); transition:.15s ease;}
  .chip:hover{color:var(--ink);}
  .chip.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .series-block{padding-block:32px 8px; scroll-margin-top:120px;}
  .series-head{display:flex; align-items:baseline; gap:10px; margin-bottom:16px;}
  .series-head h2{font-family:var(--disp); font-weight:700; font-size:20px; margin:0; letter-spacing:-0.01em;}
  .series-head .count{font-family:var(--mono); font-size:11px; color:var(--muted);}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .pcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; display:flex; flex-direction:column;}
  .pcard:hover{transform:translateY(-3px); box-shadow:0 16px 28px -18px rgba(0,0,0,.2);}
  .pcard .thumb{aspect-ratio:1/1; overflow:hidden; background:var(--surface-2); position:relative;}
  .pcard .thumb img{width:100%; height:100%; object-fit:cover; object-position:50% 22%;}
  .pcard .body{padding:10px 11px 12px;}
  .pcard .ptitle{font-family:var(--disp); font-weight:700; font-size:14.5px; margin:0 0 2px; line-height:1.15; letter-spacing:-0.01em;}
  .pcard .psub{font-size:11px; color:var(--muted); line-height:1.3; margin:0 0 8px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .specs{display:flex; flex-wrap:wrap; gap:4px;}
  .spec{font-family:var(--mono); font-size:9.5px; letter-spacing:.01em; color:var(--ink); background:var(--surface-2); border-radius:5px; padding:2px 6px;}

  .datasheet-btn{
    margin-top:9px; display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600;
    color:var(--brand); text-decoration:none; border:1px solid var(--line); border-radius:980px; padding:4px 9px;
    transition:border-color .15s ease, color .15s ease;
  }
  .datasheet-btn:hover{border-color:var(--brand); color:var(--brand);}
  .datasheet-btn svg{width:10px; height:10px;}

  /* comparativa de specs — poco texto, mucho dato */
  .compare{margin-top:8px; border:1px solid var(--line); border-radius:9px; overflow:hidden; overflow-x:auto;}
  .compare table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:10px;}
  .compare th{text-align:left; font-weight:600; padding:5px 7px; background:var(--surface-2); color:var(--muted); font-size:8.5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
  .compare td{padding:5px 7px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .compare td:first-child, .compare th:first-child{color:var(--muted); font-family:var(--sans); font-size:10px; text-transform:none; letter-spacing:0; font-weight:500; white-space:normal;}

  footer.site{border-top:1px solid var(--line); padding-block:26px; margin-top:20px;}
  footer.site .wrap{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted);}

  /* Contacto / comerciales */
  .chero{padding:56px 0 40px;}
  .rep-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; padding-bottom:72px;}
  .rep-card{
    display:flex; align-items:center; gap:16px; padding:20px; border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  .rep-photo{width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; border:1px solid var(--line);}
  .rep-info{min-width:0;}
  .rep-name{font-weight:700; font-size:16px; margin:0 0 6px;}
  .rep-line{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); text-decoration:none; margin-top:3px;}
  .rep-line:hover{color:var(--accent-ink);}
  .rep-line svg{width:14px; height:14px; flex:none; color:var(--accent);}

  .viewer{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:100; display:none; flex-direction:column;}
  .viewer.open{display:flex;}
  .v-top{display:flex; align-items:center; gap:14px; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px)); color:#f5f5f7; flex:none;}
  .v-close{width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .v-close svg{width:15px;height:15px;}
  .v-meta{min-width:0;}
  .v-crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#a1a1a6; margin-bottom:2px;}
  .v-title{font-family:var(--disp); font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .v-count{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:#a1a1a6; flex:none;}
  .v-hint{font-size:10.5px; color:#6e6e73; flex:none; display:none;}
  @media (min-width:760px){ .v-hint{display:block;} }

  .v-stage{flex:1; position:relative; overflow:hidden; touch-action:none; display:flex; align-items:center; justify-content:center;}
  .v-imgwrap{max-width:100%; max-height:100%; cursor:zoom-in; transition:transform .12s ease; transform-origin:center center; will-change:transform;}
  .v-imgwrap.zoomed{cursor:grab;}
  .v-imgwrap.dragging{cursor:grabbing; transition:none;}
  .v-imgwrap img{max-height:calc(100dvh - 150px); max-width:calc(100vw - 100px); object-fit:contain; border-radius:6px; box-shadow:0 30px 60px -20px rgba(0,0,0,.6); background:#fff; user-select:none; -webkit-user-drag:none;}

  .v-arrow{position:absolute; top:50%; translate:0 -50%; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#f5f5f7; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;}
  .v-arrow:hover{background:rgba(255,255,255,.16);}
  .v-arrow svg{width:18px; height:18px;}
  .v-arrow.prev{left:14px;} .v-arrow.next{right:14px;}
  @media (max-width:640px){ .v-arrow{width:36px; height:36px;} .v-arrow.prev{left:6px;} .v-arrow.next{right:6px;} }

  .v-bottom{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex:none;}
  .v-strip{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .v-strip::-webkit-scrollbar{display:none;}
  .v-thumb{width:40px; height:40px; flex:none; border-radius:6px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.5; transition:opacity .15s ease, border-color .15s ease;}
  .v-thumb.active{opacity:1; border-color:var(--accent);}
  .v-thumb img{width:100%; height:100%; object-fit:cover; object-position:50% 22%;}

  [hidden]{display:none !important;}
  .view{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>

<div id="app"></div>

<div class="viewer" id="viewer">
  <div class="v-top">
    <button class="v-close" id="vClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="v-meta">
      <div class="v-crumb" id="vCrumb">—</div>
      <div class="v-title" id="vTitle">—</div>
    </div>
    <div class="v-hint" id="vHint">← → para navegar · rueda o doble clic para zoom</div>
    <div class="v-count" id="vCount">—</div>
  </div>
  <div class="v-stage" id="vStage">
    <button class="v-arrow prev" id="vPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="v-imgwrap" id="vImgWrap"><img id="vImg" src="" alt=""></div>
    <button class="v-arrow next" id="vNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="v-bottom">
    <div class="v-strip" id="vStrip"></div>
  </div>
</div>

<script>
/* =========================================================
   THEME
========================================================= */
(function(){
  var saved = null;
  try{ saved = localStorage.getItem('rms-theme'); }catch(e){}
  if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
})();
function toggleTheme(){
  var el = document.documentElement;
  var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  if(next === 'dark') el.setAttribute('data-theme','dark'); else el.removeAttribute('data-theme');
  try{ localStorage.setItem('rms-theme', next); }catch(e){}
}

/* =========================================================
   IMÁGENES — rutas relativas (images/full, images/thumb, images/logos)
========================================================= */
function imgOf(p){ const d = PAGES[p]; return (d && d.img) || p; }
function fullImg(p){ return "images/full/p" + String(imgOf(p)).padStart(3,"0") + ".jpg"; }
function thumbImg(p){ return "images/thumb/p" + String(imgOf(p)).padStart(3,"0") + ".jpg"; }

const LOGO = {
  rms: "images/logos/logo-rms.png",
  meyer: "images/logos/logo-meyer.png",
  digico: "images/logos/logo-digico.png",
  hollyland: "images/logos/logo-hollyland.png",
  fourier: "images/logos/logo-fourier.png",
  atb: "images/logos/logo-atb.png",
  blacktrax: "images/logos/logo-blacktrax.png",
  fiberfox: "images/logos/logo-fiberfox.png",
  joyned: "images/logos/logo-joyned.png",
  luminex: "images/logos/logo-luminex.png",
  pointsource: "images/logos/logo-pointsource.png",
  remic: "images/logos/logo-remic.png",
  sounddevices: "images/logos/logo-sounddevices.png",
  optocore: "images/logos/logo-optocore.png",
  auvitran: "images/logos/logo-auvitran.png",
  atlasied: "images/logos/logo-atlasied.png",
  furman: "images/logos/logo-furman.png",
  harvey: "images/logos/logo-harvey.png",
  klang: "images/logos/logo-klang.png",
  teqsas: "images/logos/logo-teqsas.png",
  sony: "images/logos/logo-sony.png"
};

/* =========================================================
   GRUPOS (para filtrar la portada por uso)
========================================================= */
const GROUPS = [
  {key:"live", label:"Sonido LIVE"},
  {key:"instalacion", label:"Instalación"},
  {key:"wireless", label:"Microfonía y Wireless"},
  {key:"intercom", label:"Comunicación"},
  {key:"red", label:"Red y Conectividad"},
  {key:"iluminacion", label:"Iluminación y Tracking"},
  {key:"energia", label:"Energía y Protección"},
];

/* =========================================================
   COMERCIALES — equipo de contacto RMS Proaudio.
========================================================= */
const REPS = [
  {name:"Salvador Escobar", email:"salva@rmsproaudio.com", phone:"607 709 777", photo:"images/reps/salvador-escobar.jpg"},
];

/* =========================================================
   MARCAS — las 20 del catálogo, todas con sus fichas reales.

const app = document.getElementById("app");

function shell(inner){
  return `
  <header class="site">
    <div class="wrap site-bar">
      <div class="mark" onclick="location.hash=''">
        <img class="blogo" src="${LOGO.rms}" alt="RMS Proaudio">
      </div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar producto o serie…" autocomplete="off">
        <span class="kbd">/</span>
        <div class="results" id="results"></div>
      </div>
      <a class="contact-link" href="#/contacto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="5"/></svg>
        <span>Tu comercial</span>

      <button class="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema">

        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="view">${inner}</div>
  `;
}

/* =========================================================
   RENDER: HOME
========================================================= */
function renderHome(){
  const featured = [3,9,19,28,32,36,41,50,65,74,83,98,1005,119,125,130];
  const marquee = featured.concat(featured).map(p =>
    `<div class="m-item" onclick="openViewer(${p})" title="${PAGES[p].title}"><img loading="lazy" src="${thumbImg(p)}" alt=""></div>`
  ).join("");

  const groupChips = [`<button class="gchip active" data-group="all">Todas</button>`]
    .concat(GROUPS.map(g => `<button class="gchip" data-group="${g.key}">${g.label}</button>`)).join("");

  const brandCards = Object.entries(BRANDS).map(([key,b]) => `
    <div class="brand-card" data-brand="${key}" data-groups="${b.groups.join(' ')}" style="--brand:${b.accent}" onclick="location.hash='#/brand/${key}'">
      <img class="blogo" src="${b.logo}" alt="${b.name}">
      <p class="btag">${b.tagline}</p>
      <div class="brand-meta">
        <span class="brand-count">${b.pages.length} ${b.pages.length===1?'ficha':'fichas'}</span>
        <span class="brand-cta">Ver catálogo
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </div>
  `).join("");

  app.innerHTML = shell(`
    <div class="wrap hero">
      <span class="eyebrow">RMS Proaudio · 2026</span>
      <h1 class="hero-title">Todo el sonido profesional.</h1>
      <p class="lede">Las marcas de referencia mundial en audio, iluminación y conectividad para directo e instalación.</p>
      <div class="marquee"><div class="marquee-track">${marquee}</div></div>
    </div>

    <div class="wrap">
      <div style="margin-top:48px;">
        <h2 class="section-title">Marcas</h2>
        <p class="section-sub">Elige un uso para filtrar, o explora el catálogo completo.</p>
        <div class="group-nav" id="groupNav">${groupChips}</div>
        <div class="brand-grid" id="brandGrid">${brandCards}</div>
      </div>
    </div>

    <footer class="site"><div class="wrap">
      <span>RMS Proaudio · Distribuidor oficial</span>
      <span>955 542 111 · info@rmsproaudio.com</span>
    </div></footer>
  `);
  bindSearch();
  bindGroupNav();
}

function bindGroupNav(){
  const chips = document.querySelectorAll(".gchip");
  const cards = document.querySelectorAll(".brand-card");
  chips.forEach(c => c.addEventListener("click", () => {
    chips.forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    const g = c.dataset.group;
    cards.forEach(card => {
      const groups = card.dataset.groups.split(" ");
      card.classList.toggle("hidden", g !== "all" && !groups.includes(g));
    });
  }));
}

/* =========================================================
   RENDER: BRAND
========================================================= */
function renderBrand(key){
  const b = BRANDS[key];
  if(!b){ location.hash=''; return; }

  if(!b.pages.length){
    app.innerHTML = shell(`
      <div class="bhero" style="--brand:${b.accent}">
        <div class="wrap">
          <span class="back-link" onclick="location.hash=''"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Todas las marcas</span>
          <img class="bhero-logo" src="${b.logo}" alt="${b.name}">
          <p class="bhero-sub">${b.tagline}</p>
        </div>
      </div>
      <div class="wrap empty-state">Las fichas de ${b.name} se están preparando y llegarán muy pronto a este catálogo.</div>
      <footer class="site"><div class="wrap">
        <span>RMS Proaudio · Distribuidor oficial</span>
        <span>955 542 111 · info@rmsproaudio.com</span>
      </div></footer>
    `);
    bindSearch();
    return;
  }

  const seriesOrder = [];
  const bySeries = {};
  b.pages.forEach(p => {
    const d = PAGES[p];
    if(!bySeries[d.series]){ bySeries[d.series]=[]; seriesOrder.push(d.series); }
    bySeries[d.series].push(p);
  });

  const chips = seriesOrder.map((s,i) => `<button class="chip ${i===0?'active':''}" data-target="s-${slug(s)}">${s}</button>`).join("");

  const blocks = seriesOrder.map(s => {
    const cards = bySeries[s].map(p => {
      const d = PAGES[p];
      const specs = d.specs.map(([k,v]) => `<span class="spec">${k} ${v}</span>`).join("");
      const compareHtml = d.compare ? `
        <div class="compare"><table>
          <tr><th>Modelo</th>${d.compare.cols.map(c=>`<th>${c}</th>`).join("")}</tr>
          ${d.compare.rows.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}
        </table></div>` : "";
      const datasheetHtml = d.datasheet ? `
        <a class="datasheet-btn" href="${d.datasheet}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
          Datasheet
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>` : "";
      return `
        <div class="pcard" onclick="openViewer(${p})">
          <div class="thumb"><img loading="lazy" src="${thumbImg(p)}" alt="${d.title}"></div>
          <div class="body">
            <p class="ptitle">${d.title}</p>
            <p class="psub">${d.sub}</p>
            <div class="specs">${specs}</div>
            ${compareHtml}
            ${datasheetHtml}
          </div>
        </div>`;
    }).join("");
    return `
      <div class="wrap series-block" id="s-${slug(s)}">
        <div class="series-head"><h2>${s}</h2><span class="count">${bySeries[s].length}</span></div>
        <div class="card-grid">${cards}</div>
      </div>`;
  }).join("");

  app.innerHTML = shell(`
    <div class="bhero" style="--brand:${b.accent}">
      <div class="wrap">
        <span class="back-link" onclick="location.hash=''"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Todas las marcas</span>
        <img class="bhero-logo" src="${b.logo}" alt="${b.name}">
        <p class="bhero-sub">${b.tagline}</p>
        <div class="bhero-stats">
          <div class="stat"><b>${b.pages.length}</b><span>Fichas</span></div>
          <div class="stat"><b>${seriesOrder.length}</b><span>Series</span></div>
        </div>
      </div>
    </div>
    <nav class="series-nav" style="--brand:${b.accent}"><div class="wrap series-nav-track">${chips}</div></nav>
    ${blocks}
    <footer class="site"><div class="wrap">
      <span>RMS Proaudio · Distribuidor oficial</span>
      <span>955 542 111 · info@rmsproaudio.com</span>
    </div></footer>
  `);
  bindSearch();
  bindSeriesNav();
}

function slug(s){ return s.toLowerCase().normalize("NFD").replace(/[^\x00-\x7F]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }

function bindSeriesNav(){
  const chips = document.querySelectorAll(".chip");
  chips.forEach(c => c.addEventListener("click", () => {
    const el = document.getElementById(c.dataset.target);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start", inline:"nearest"});
  }));
  const blocks = document.querySelectorAll(".series-block");
  if(!blocks.length) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        chips.forEach(c => c.classList.toggle("active", c.dataset.target === e.target.id));
      }
    });
  }, {rootMargin:"-140px 0px -70% 0px", threshold:0});
  blocks.forEach(b => obs.observe(b));
}

/* =========================================================
   SEARCH
========================================================= */
function bindSearch(){
  const input = document.getElementById("searchInput");
  const results = document.getElementById("results");
  if(!input) return;

  function doSearch(q){
    q = q.trim().toLowerCase();
    if(!q){ results.classList.remove("open"); results.innerHTML=""; return; }
    const matches = Object.entries(PAGES).filter(([p,d]) => {
      const hay = [d.title, d.sub, d.series, BRANDS[d.brand].name, ...(d.tags||[])].join(" ").toLowerCase();
      return hay.includes(q);
    }).slice(0,8);
    if(!matches.length){
      results.innerHTML = `<div class="r-empty">Sin resultados para "${q}"</div>`;
    } else {
      results.innerHTML = matches.map(([p,d]) => `
        <div class="r-item" onclick="openViewer(${p})">
          <img src="${thumbImg(p)}" alt="">
          <div class="r-text">
            <div class="r-brand">${BRANDS[d.brand].name} · ${d.series}</div>
            <div class="r-title">${d.title}</div>
            <div class="r-sub">${d.sub}</div>
          </div>
        </div>`).join("");
    }
    results.classList.add("open");
  }

  input.addEventListener("input", e => doSearch(e.target.value));
  input.addEventListener("focus", e => { if(e.target.value) doSearch(e.target.value); });
  document.addEventListener("click", e => { if(!e.target.closest(".searchbox")) results.classList.remove("open"); });
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== input && !viewerOpen()){ e.preventDefault(); input.focus(); }
    if(e.key === "Escape"){ results.classList.remove("open"); input.blur(); }
  });
}

/* =========================================================
   VIEWER
========================================================= */
const viewerEl = document.getElementById("viewer");
const vImg = document.getElementById("vImg");
const vImgWrap = document.getElementById("vImgWrap");
const vStage = document.getElementById("vStage");
let currentList = [];
let currentIndex = -1;
let scale = 1, panX = 0, panY = 0;

function viewerOpen(){ return viewerEl.classList.contains("open"); }

function openViewer(page){
  const d = PAGES[page];
  currentList = BRANDS[d.brand].pages;
  currentIndex = currentList.indexOf(page);
  document.getElementById("results").classList.remove("open");
  renderViewer();
  viewerEl.classList.add("open");
  document.body.style.overflow = "hidden";
  location.hash = `#/view/${page}`;
}

function closeViewer(){
  viewerEl.classList.remove("open");
  document.body.style.overflow = "";
  const d = PAGES[currentList[currentIndex]];
  location.hash = d ? `#/brand/${d.brand}` : "";
}

function renderViewer(){
  const page = currentList[currentIndex];
  const d = PAGES[page];
  const b = BRANDS[d.brand];
  resetZoom();
  vImg.src = fullImg(page);
  vImg.alt = d.title;
  document.getElementById("vCrumb").textContent = `${b.name} · ${d.series}`;
  document.getElementById("vTitle").textContent = d.title;
  document.getElementById("vCount").textContent = `${currentIndex+1} / ${currentList.length}`;
  document.getElementById("vStrip").innerHTML = currentList.map((p,i) => `
    <div class="v-thumb ${i===currentIndex?'active':''}" onclick="goTo(${i})"><img src="${thumbImg(p)}" alt=""></div>
  `).join("");
  const active = document.querySelector(".v-thumb.active");
  if(active) active.scrollIntoView({inline:"center", block:"nearest"});
}

function goTo(i){
  if(i < 0 || i >= currentList.length) return;
  currentIndex = i;
  renderViewer();
  location.hash = `#/view/${currentList[currentIndex]}`;
}
function goNext(){ goTo(currentIndex+1); }
function goPrev(){ goTo(currentIndex-1); }

function resetZoom(){ scale=1; panX=0; panY=0; applyTransform(); vImgWrap.classList.remove("zoomed"); }
function applyTransform(){ vImgWrap.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`; }

vImgWrap.addEventListener("dblclick", () => {
  if(scale === 1){ scale = 2.2; vImgWrap.classList.add("zoomed"); }
  else { resetZoom(); }
  applyTransform();
});
vStage.addEventListener("wheel", e => {
  e.preventDefault();
  const delta = -e.deltaY * 0.0016;
  scale = Math.min(4, Math.max(1, scale + delta));
  if(scale === 1){ panX=0; panY=0; vImgWrap.classList.remove("zoomed"); } else vImgWrap.classList.add("zoomed");
  applyTransform();
}, {passive:false});

let dragging = false, lastX=0, lastY=0;
vImgWrap.addEventListener("pointerdown", e => {
  if(scale === 1) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  vImgWrap.classList.add("dragging");
  vImgWrap.setPointerCapture(e.pointerId);
});
vImgWrap.addEventListener("pointermove", e => {
  if(!dragging) return;
  panX += e.clientX - lastX; panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
function endDrag(){ if(dragging){ dragging=false; vImgWrap.classList.remove("dragging"); } }
vImgWrap.addEventListener("pointerup", endDrag);
vImgWrap.addEventListener("pointercancel", endDrag);

let touchStartX = 0, touchStartY = 0;
vStage.addEventListener("touchstart", e => {
  if(e.touches.length===1){ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
}, {passive:true});
vStage.addEventListener("touchend", e => {
  if(scale > 1) return;
  const dx = (e.changedTouches[0].clientX - touchStartX);
  const dy = (e.changedTouches[0].clientY - touchStartY);
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(dx < 0) goNext(); else goPrev();
  }
}, {passive:true});

document.getElementById("vClose").addEventListener("click", closeViewer);
document.getElementById("vNext").addEventListener("click", goNext);
document.getElementById("vPrev").addEventListener("click", goPrev);
document.addEventListener("keydown", e => {
  if(!viewerOpen()) return;
  if(e.key === "Escape") closeViewer();
  if(e.key === "ArrowRight") goNext();
  if(e.key === "ArrowLeft") goPrev();
});

/* =========================================================
   ROUTER
========================================================= */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if(parts[0] === "brand" && BRANDS[parts[1]]){
    viewerEl.classList.remove("open"); document.body.style.overflow="";
    renderBrand(parts[1]);
  } else if(parts[0] === "contacto"){
    viewerEl.classList.remove("open"); document.body.style.overflow="";
    renderContact();
  } else if(parts[0] === "view" && PAGES[parts[1]]){
    const page = Number(parts[1]);
    const d = PAGES[page];
    renderBrand(d.brand);
    openViewer(page);
  } else {
    viewerEl.classList.remove("open"); document.body.style.overflow="";
    renderHome();
  }
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
route();
</script>
